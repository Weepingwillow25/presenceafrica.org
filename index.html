<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coded Online Language</title>
  <style>
    /* Base Reset & Fonts */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #FFFFFF;
      color: #123354;
      padding: 24px 16px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Section Header */
    .header-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #123354;
      background: #EBF2FA;
      border: 1px solid #D0E1F4;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 8px;
    }

    h1.section-title {
      font-size: 28px;
      font-weight: 800;
      color: #123354;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    p.section-sub {
      font-size: 15px;
      color: #5B6472;
      line-height: 1.5;
      margin-bottom: 24px;
      max-width: 750px;
    }

    /* Dictionary Container Card */
    .dict-card {
      background-color: #F4F6F9;
      border: 1px solid #E2E8F0;
      border-radius: 28px;
      padding: 24px;
    }

    /* Top Controls Box */
    .controls-panel {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .index-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #5B6472;
      margin-bottom: 10px;
    }

    /* A-Z Alphabet Navigation */
    .alphabet-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .letter-pill {
      min-width: 36px;
      height: 36px;
      padding: 0 8px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid #D0E1F4;
      background-color: #EBF2FA;
      color: #123354;
      transition: all 0.15s ease;
    }

    .letter-pill:hover {
      background-color: #123354;
      color: #FFFFFF;
      border-color: #123354;
    }

    .letter-pill.disabled {
      background-color: transparent;
      color: #CBD5E1;
      border-color: transparent;
      cursor: not-allowed;
      opacity: 0.4;
    }

    /* Live Search Input */
    .search-wrap {
      position: relative;
      margin-top: 10px;
    }

    .search-input {
      width: 100%;
      background: #FFFFFF;
      color: #123354;
      border: 1px solid #D0E1F4;
      border-radius: 9999px;
      padding: 12px 18px 12px 42px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #123354;
      box-shadow: 0 0 0 3px rgba(18, 51, 84, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 14px;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #123354;
      stroke-width: 2.2;
    }

    /* Letter Bucket Section */
    .letter-section {
      margin-bottom: 28px;
      scroll-margin-top: 24px;
    }

    .letter-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      border-bottom: 2px solid rgba(18, 51, 84, 0.15);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .letter-char {
      font-size: 32px;
      font-weight: 800;
      color: #123354;
    }

    .letter-count {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #5B6472;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      padding: 2px 8px;
      border-radius: 9999px;
    }

    /* Entries List */
    .entries-box {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      overflow: hidden;
    }

    .entry-row {
      padding: 18px 20px;
      border-bottom: 1px solid #E2E8F0;
      transition: background 0.15s ease;
    }

    .entry-row:last-child {
      border-bottom: none;
    }

    .entry-row:hover {
      background: #FAFBFD;
    }

    .entry-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      margin-bottom: 8px;
    }

    .entry-term {
      font-size: 18px;
      font-weight: 800;
      color: #123354;
    }

    .entry-translation {
      font-size: 13px;
      font-style: italic;
      color: #5B6472;
    }

    /* Category Badges */
    .badges-group {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 9999px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    /* Badges Color System */
    .badge-harassment {
      background-color: #EBF2FA;
      color: #123354;
      border-color: #D0E1F4;
    }
    .badge-doxxing {
      background-color: #FFF4D9;
      color: #946B00;
      border-color: #F6E0A4;
    }
    .badge-coercion {
      background-color: #E1F6EA;
      color: #127A47;
      border-color: #BAE9CD;
    }
    .badge-threat {
      background-color: #FBEAE7;
      color: #B0402F;
      border-color: #F6C6BE;
    }

    /* Entry Content */
    .entry-desc {
      font-size: 14px;
      color: #5B6472;
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .entry-nuance {
      font-size: 12px;
      color: #475569;
      background: #F4F6F9;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 6px;
      line-height: 1.4;
    }

    .entry-example {
      font-size: 12px;
      color: #5B6472;
      margin-top: 6px;
    }

    .example-tag {
      background: #EBF2FA;
      color: #123354;
      font-family: monospace;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }

    .empty-state {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      color: #5B6472;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. Header -->
    <div class="header-tag">Coded Online Language</div>
    <h1 class="section-title">Slang built to slip past moderators — not past you.</h1>
    <p class="section-sub">
      Explore documented coded words, disguised phrases, and online slang used in Kenya's digital spaces to evade safety filters, facilitate harassment, or demean targets.
    </p>

    <!-- 2. Main Dictionary Card -->
    <div class="dict-card">
      
      <!-- Top Controls: A-Z Nav + Search -->
      <div class="controls-panel">
        <div class="index-title">Alphabetical Index (A–Z)</div>
        <div class="alphabet-row" id="alphabetNav"></div>

        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="lexiconSearch" class="search-input" placeholder="Search by slang term, meaning, cultural context, or category..." />
        </div>
      </div>

      <!-- 3. Entries Container -->
      <div id="lexiconContent"></div>

    </div>

  </div>

  <script>
    // Full Lexicon Dataset
    const LEXICON_DATA = [
      {
        id: 'asalimiwe',
        term: 'Asalimiwe',
        translation: 'Let them be greeted',
        category: 'Threat / Incitement',
        badgeType: 'threat',
        desc: 'Originally an innocuous Swahili greeting. Online, it is weaponized as a directive to launch cyberbullying, doxxing, or mass targeted harassment against a specific individual.',
        nuance: 'Signaling phrase used to activate digital mob attacks and brigade comment sections.',
        example: 'Huyu amezidi, leo lazima asalimiwe.'
      },
      {
        id: 'chuma-ya-doshi',
        term: 'Chuma ya doshi',
        translation: 'Steel of Doshi',
        category: 'Sexism & Misogyny',
        badgeType: 'harassment',
        desc: 'Originates from an advertising campaign by a steel manufacturing firm. Deployed online to vulgarize male anatomy or assert sexual dominance over women.',
        nuance: 'Promotes toxic masculinity and objectification in comment sections and DMs.',
        example: 'Madem hawataki chuma ya doshi wanataka chuma ya mdosi.'
      },
      {
        id: 'dust',
        term: 'Dust / Kudustishwa',
        translation: 'To face harsh heartbreak / humiliation',
        category: 'Cyberbullying & Harassment',
        badgeType: 'harassment',
        desc: 'Modern Kenyan digital slang referencing emotional devastation, relationship breakdown, or public humiliation.',
        nuance: 'Used in public pile-ons to mock people experiencing intimate distress or betrayal.',
        example: 'Huko nje ni dust tu.'
      },
      {
        id: 'kamati',
        term: 'Kamati ya roho chafu',
        translation: 'Committee of malicious hearts',
        category: 'Online Mob Violence',
        badgeType: 'threat',
        desc: 'Used to designate coordinated networks of online trolls and accounts dedicated to mass smear campaigns.',
        nuance: 'Weaponized to coordinate harassment, circulate unverified claims, and attack women in public life.',
        example: 'Kamati ya roho chafu imeingia kwa comments zake.'
      },
      {
        id: 'kugongewa',
        term: 'Kugongewa',
        translation: 'To be cheated on',
        category: 'Slut Shaming & Harassment',
        badgeType: 'harassment',
        desc: 'Derived from the verb "gonga" (to hit). Weaponized online to publicize allegations of infidelity and demean women\'s sexual agency.',
        nuance: 'Commonly used to initiate slut-shaming threads and reputation damage campaigns.',
        example: 'Kugongewa alafu manzi yako akushow we are done.'
      },
      {
        id: 'kulana',
        term: 'Kulana',
        translation: 'To consume / engage in illicit encounters',
        category: 'Coercion & Sexual Objectification',
        badgeType: 'coercion',
        desc: 'Reduces human relationships to predatory transactional consumption.',
        nuance: 'Deployed in gossip threads to insinuate sexual exploitation or moral compromise.',
        example: 'Hao wawili wanakulana chini ya maji.'
      },
      {
        id: 'msenge',
        term: 'Msenge',
        translation: 'Homophobic slur',
        category: 'Threat / Incitement',
        badgeType: 'threat',
        desc: 'Deeply derogatory term weaponized to demean, emasculate, and incite harassment against individuals online.',
        nuance: 'Violates platform hate-speech guidelines across Meta, X, and TikTok.',
        example: 'Msenge wewe.'
      },
      {
        id: 'mteremko',
        term: 'Mteremko',
        translation: 'Slope / Easy route',
        category: 'Sexism & Misogyny',
        badgeType: 'harassment',
        desc: 'Used to demean women by asserting their professional or financial achievements were achieved through sexual favors.',
        nuance: 'Delegitimizes women in leadership, corporate spheres, and politics.',
        example: 'Alipata hiyo job kwa mteremko tu.'
      },
      {
        id: 'pochi',
        term: 'Pochi',
        translation: 'Purse / Handbag',
        category: 'Sexual Objectification',
        badgeType: 'doxxing',
        desc: 'Equates female autonomy and anatomy to commercial commodities or transactional exchange.',
        nuance: 'Reduces women\'s opinions and careers to transactional sexuality.',
        example: 'Waonyeshe penye utapeleka pochi yako.'
      },
      {
        id: 'submissive',
        term: 'Submissive',
        translation: 'Unquestioning obedience',
        category: 'Silencing & Gaslighting',
        badgeType: 'harassment',
        desc: 'Weaponized online to demand subservience and silence women speaking on rights or autonomy.',
        nuance: 'Used to police women\'s tone and shame independent viewpoints.',
        example: 'Women should just be submissive.'
      },
      {
        id: 'umama',
        term: 'Umama',
        translation: 'Womanlike / Effeminate (pejorative)',
        category: 'Sexism & Misogyny',
        badgeType: 'harassment',
        desc: 'Derived from "mama" (mother). Pejoratively projects feminine attributes as synonyms for weakness, gossiping, or emotional volatility.',
        nuance: 'Reinforces misogyny by weaponizing womanhood as an insult.',
        example: 'Na huku mkona umama sana.'
      },
      {
        id: 'umbwa',
        term: 'Umbwa / Mbwa',
        translation: 'Dog',
        category: 'Cyberbullying & Harassment',
        badgeType: 'harassment',
        desc: 'Direct verbal abuse used to dehumanize targets and demean their personal integrity.',
        nuance: 'Frequent trigger term for automated reporting under verbal abuse policies.',
        example: 'Kama unadate we ni mbwa.'
      }
    ];

    const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    function getFirstChar(str) {
      const clean = str.replace(/[^a-zA-Z]/g, '');
      return (clean.charAt(0) || '#').toUpperCase();
    }

    function renderAlphabetNav(activeLetters) {
      const nav = document.getElementById('alphabetNav');
      nav.innerHTML = '';

      ALPHABET.forEach(letter => {
        const hasEntries = activeLetters.has(letter);
        const pill = document.createElement(hasEntries ? 'a' : 'span');
        pill.textContent = letter;
        pill.className = `letter-pill ${hasEntries ? '' : 'disabled'}`;
        if (hasEntries) {
          pill.href = `#letter-${letter}`;
          pill.addEventListener('click', (e) => {
            e.preventDefault();
            const target = document.getElementById(`letter-${letter}`);
            if (target) {
              target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        }
        nav.appendChild(pill);
      });
    }

    function renderLexicon(query = '') {
      const q = query.trim().toLowerCase();
      const content = document.getElementById('lexiconContent');
      content.innerHTML = '';

      // Filter and sort
      const filtered = LEXICON_DATA.filter(item => {
        if (!q) return true;
        return (
          item.term.toLowerCase().includes(q) ||
          item.translation.toLowerCase().includes(q) ||
          item.desc.toLowerCase().includes(q) ||
          item.category.toLowerCase().includes(q) ||
          (item.nuance && item.nuance.toLowerCase().includes(q))
        );
      }).sort((a, b) => {
        const cleanA = a.term.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
        const cleanB = b.term.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
        return cleanA.localeCompare(cleanB);
      });

      // Group by letter
      const groups = {};
      const activeLetters = new Set();

      filtered.forEach(item => {
        const letter = getFirstChar(item.term);
        activeLetters.add(letter);
        if (!groups[letter]) groups[letter] = [];
        groups[letter].push(item);
      });

      renderAlphabetNav(activeLetters);

      if (filtered.length === 0) {
        content.innerHTML = `<div class="empty-state">No matching coded language entries found for "${query}".</div>`;
        return;
      }

      // Render each letter section
      ALPHABET.forEach(letter => {
        const items = groups[letter];
        if (!items || items.length === 0) return;

        const section = document.createElement('div');
        section.className = 'letter-section';
        section.id = `letter-${letter}`;

        section.innerHTML = `
          <div class="letter-header">
            <span class="letter-char">${letter}</span>
            <span class="letter-count">${items.length} ${items.length === 1 ? 'entry' : 'entries'}</span>
          </div>
          <div class="entries-box">
            ${items.map(item => `
              <div class="entry-row">
                <div class="entry-top">
                  <span class="entry-term">${item.term}</span>
                  <span class="entry-translation">("${item.translation}")</span>
                  <div class="badges-group">
                    <span class="badge badge-${item.badgeType}">${item.category}</span>
                  </div>
                </div>
                <div class="entry-desc">${item.desc}</div>
                ${item.nuance ? `<div class="entry-nuance"><strong>Online weaponization:</strong> ${item.nuance}</div>` : ''}
                ${item.example ? `<div class="entry-example"><strong>Observed example:</strong> <span class="example-tag">"${item.example}"</span></div>` : ''}
              </div>
            `).join('')}
          </div>
        `;

        content.appendChild(section);
      });
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      renderLexicon();

      const searchInput = document.getElementById('lexiconSearch');
      searchInput.addEventListener('input', (e) => {
        renderLexicon(e.target.value);
      });
    });
  </script>
</body>
</html>
